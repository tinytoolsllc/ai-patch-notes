<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Release Notes — Offline</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #f8fafc;
        color: #1e293b;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 1rem;
      }
      .container {
        text-align: center;
        max-width: 400px;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: #1e293b;
      }
      p {
        color: #64748b;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 0.5rem;
        padding: 0.625rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <svg
        class="icon"
        width="64"
        height="64"
        viewBox="0 0 64 64"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <rect
          x="10"
          y="8"
          width="44"
          height="52"
          rx="4"
          fill="#dbeafe"
          stroke="#2563eb"
          stroke-width="2"
        />
        <circle cx="18" cy="8" r="2" fill="#2563eb" />
        <circle cx="28" cy="8" r="2" fill="#2563eb" />
        <circle cx="38" cy="8" r="2" fill="#2563eb" />
        <circle cx="48" cy="8" r="2" fill="#2563eb" />
        <path
          d="M24 30L32 26L40 30L40 40L32 44L24 40Z"
          fill="#bfdbfe"
          stroke="#2563eb"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
        <path
          d="M24 30L32 26L40 30L32 34Z"
          fill="#93c5fd"
          stroke="#2563eb"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
        <line x1="32" y1="34" x2="32" y2="44" stroke="#2563eb" stroke-width="1.5" />
        <line
          x1="18"
          y1="50"
          x2="32"
          y2="50"
          stroke="#60a5fa"
          stroke-width="1.5"
          stroke-linecap="round"
        />
        <line
          x1="18"
          y1="54"
          x2="28"
          y2="54"
          stroke="#93c5fd"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      <h1>You're offline</h1>
      <p>My Release Notes needs a network connection to load your feeds. Please check your connection and try again.</p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
