version: 2
updates:
  # npm dependencies for root (husky)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # @types/node major must track devEngines.runtime.node (>=22).
      # Pinned to 22.x via the catalog in pnpm-workspace.yaml.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        patterns:
          - "*"
        dependency-type: "development"

  # npm dependencies for React frontend
  - package-ecosystem: "npm"
    directory: "/patchnotes-web"
    schedule:
      interval: "weekly"
    ignore:
      # @types/node major must track devEngines.runtime.node (>=22).
      # Pinned to 22.x via the catalog in pnpm-workspace.yaml.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      production:
        dependency-type: "production"
        patterns:
          - "*"
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"

  # npm dependencies for email Azure Function
  - package-ecosystem: "npm"
    directory: "/patchnotes-email"
    schedule:
      interval: "weekly"
    ignore:
      # @types/node major must track devEngines.runtime.node (>=22).
      # Pinned to 22.x via the catalog in pnpm-workspace.yaml.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      production:
        dependency-type: "production"
        patterns:
          - "*"
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"

  # NuGet dependencies for .NET projects
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # v3 removes ITelemetryInitializer, crashes the Functions worker
      - dependency-name: "Microsoft.ApplicationInsights.WorkerService"
        versions: [">=3.0.0"]
    groups:
      dotnet:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # v6 bootstraps pnpm v11-rc, which is incompatible with our lockfile.
      # Action is pinned to v5 in the workflows (see 5c866dd).
      - dependency-name: "pnpm/action-setup"
        versions: [">=6"]
    groups:
      actions:
        patterns:
          - "*"
